services:

  # ------------------------------------------------------------------ #
  # Ollama — servidor de LLM local (llama3.2:3b)
  # ------------------------------------------------------------------ #
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Passthrough de GPU NVIDIA — requer nvidia-container-toolkit no host
    # Instale com: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ------------------------------------------------------------------ #
  # One-shot: baixa o modelo na primeira execução
  # ------------------------------------------------------------------ #
  ollama-setup:
    image: ollama/ollama:latest
    container_name: ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2:3b"]
    restart: "no"

  # ------------------------------------------------------------------ #
  # One-shot: pré-carrega o modelo na VRAM após o pull
  # ------------------------------------------------------------------ #
  ollama-warmup:
    image: ollama/ollama:latest
    container_name: ollama-warmup
    depends_on:
      ollama:
        condition: service_healthy
      ollama-setup:
        condition: service_completed_successfully
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "run", "llama3.2:3b", ""]
    restart: "no"

  # ------------------------------------------------------------------ #
  # Redis — broker e backend de resultados para o Celery
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ #
  # Celery Worker — processa geração de laudos via Ollama
  # ------------------------------------------------------------------ #
  celery-worker:
    build:
      context: .
      dockerfile: 2.PredictionApi/Dockerfile
    container_name: celery-worker
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info", "--concurrency=1"]
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      ollama-warmup:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # FastAPI — Prediction API
  # ------------------------------------------------------------------ #
  api:
    build:
      context: .
      dockerfile: 2.PredictionApi/Dockerfile
    container_name: prediction-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      ollama-warmup:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ------------------------------------------------------------------ #
  # Angular — Frontend (build + nginx)
  # ------------------------------------------------------------------ #
  front:
    build:
      context: 3.Front
      dockerfile: Dockerfile
    container_name: front
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
    name: ollama_models
